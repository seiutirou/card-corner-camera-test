<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>カード四隅メーカー｜ガイド撮影 Ver.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f5f7fc;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:620px;margin:auto;padding:14px}h1{font-size:20px}p{color:#cbd5e1;font-size:14px;line-height:1.5}.panel{background:#1b2940;border-radius:14px;padding:12px;margin:12px 0}.stage{position:relative;width:100%;height:min(64vh,600px);min-height:300px;background:#070b11;border-radius:10px;overflow:hidden}video{width:100%;height:100%;object-fit:contain}.guide{position:absolute;border:3px solid #3ef6a0;border-radius:8px;pointer-events:none;display:none;box-shadow:0 0 0 999px #0005}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,.btn{border:0;background:#4be4a2;color:#08152a;padding:12px;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.secondary{background:#344662;color:white}input[type=file]{display:none}.editor{position:relative;width:100%;background:#05080e;touch-action:none;border-radius:8px;overflow:hidden}#editCanvas{display:block;width:100%;height:auto;touch-action:none}.hint{font-size:12px;color:#cbd5e1}.result{margin:12px 0;padding:10px;background:#101827;border-radius:10px}.result img{width:100%;max-width:360px;display:block;margin:8px auto}.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.thumbs img{width:100%;border-radius:5px}.thumbs a{display:block;text-align:center;color:#9feac8;font-size:13px;padding:5px}.status{color:#a5f3fc}a{color:#a5f3fc} [hidden]{display:none!important}
</style></head><body><main class="wrap"><h1>カード四隅メーカー｜ガイド撮影 Ver.2</h1><p>ガイド撮影 → 四隅を指で調整 → 遠近補正 → 四隅画像を保存。画像は端末内で処理され、サーバーに送信しません。</p>
<section class="panel" id="capturePanel"><strong id="sideLabel">① 表面を撮影</strong><div class="stage" id="stage"><video id="video" autoplay playsinline muted></video><div class="guide" id="guide"></div></div><div class="bar"><button id="start">カメラを起動</button><button id="snap" disabled>撮影する</button><button id="stop" class="secondary" disabled>カメラ停止</button><label class="btn secondary">写真を選ぶ（代替）<input type="file" id="file" accept="image/*"></label></div><p class="hint">緑枠にカードを合わせ、できるだけ真上から撮影してください。撮影後に四隅を調整できます。</p></section>
<section class="panel" id="editPanel" hidden><strong id="editLabel">四隅の位置を調整</strong><p class="hint">青い線がカードの外周と一致するよう、4つの黄色い丸を指で動かしてください。拡大して確認したい場合は下の表示倍率を変更できます。</p><div class="editor"><canvas id="editCanvas"></canvas></div><div class="bar"><button id="apply">この位置で補正する</button><button id="retake" class="secondary">撮り直す</button></div><p id="editStatus" class="status"></p></section>
<section class="panel"><strong>加工結果</strong><div id="results"><p>まだ画像がありません。</p></div><div class="bar"><button id="reset" class="secondary">表面からやり直す</button></div></section><p id="status" class="status" role="status">待機中</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id),video=$('video'),stage=$('stage'),guide=$('guide'),canvas=$('editCanvas'),ctx=canvas.getContext('2d');
const names=['表面','裏面'];let stream=null,side=0,source=null,points=[],drawRect=null,drag=-1,results=[null,null];
function status(s){$('status').textContent=s}
function setSide(){ $('sideLabel').textContent=side===2?'撮影完了':(side===0?'① 表面を撮影':'② 裏面を撮影') }
function layout(){if(!video.videoWidth||!video.videoHeight){guide.style.display='none';return}const W=stage.clientWidth,H=stage.clientHeight,s=Math.min(W/video.videoWidth,H/video.videoHeight),vw=video.videoWidth*s,vh=video.videoHeight*s,gh=Math.min(vh*.76,vw*.76/(63/88)),gw=gh*63/88;Object.assign(guide.style,{display:'block',width:gw+'px',height:gh+'px',left:(W-gw)/2+'px',top:(H-gh)/2+'px'})}
async function start(){try{stop();if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPSのSafariで開いてください');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:2560}}});video.srcObject=stream;await video.play();layout();$('snap').disabled=false;$('stop').disabled=false;status('カメラが起動しました。カードを緑枠に合わせて撮影してください。')}catch(e){status('カメラ起動エラー：'+e.name+' / '+e.message)}}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;guide.style.display='none';$('snap').disabled=true;$('stop').disabled=true}
function guidePoints(){const W=stage.clientWidth,H=stage.clientHeight,s=Math.min(W/video.videoWidth,H/video.videoHeight),ox=(W-video.videoWidth*s)/2,oy=(H-video.videoHeight*s)/2;const x=(guide.offsetLeft-ox)/s,y=(guide.offsetTop-oy)/s,w=guide.offsetWidth/s,h=guide.offsetHeight/s;return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(([a,b])=>[Math.max(0,Math.min(video.videoWidth-1,a)),Math.max(0,Math.min(video.videoHeight-1,b))])}
function imageFromCanvas(c){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=c.toDataURL('image/jpeg',.96)})}
async function snap(){if(!stream||!video.videoWidth||side>=2)return;try{const p=guidePoints(),c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);const img=await imageFromCanvas(c);edit(img,p)}catch(e){status('撮影エラー：'+e.message)}}
async function loadFile(e){const file=e.target.files?.[0];if(!file)return;try{const url=URL.createObjectURL(file),img=new Image();await new Promise((ok,ng)=>{img.onload=ok;img.onerror=ng;img.src=url});URL.revokeObjectURL(url);const r=63/88;let w=img.naturalWidth*.75,h=w/r;if(h>img.naturalHeight*.75){h=img.naturalHeight*.75;w=h*r}const x=(img.naturalWidth-w)/2,y=(img.naturalHeight-h)/2;edit(img,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]);status('写真を読み込みました。黄色い丸をカード外周に合わせてください。')}catch(err){status('読み込み失敗：'+err.message)}e.target.value=''}
function edit(img,p){source=img;points=p.map(a=>a.slice());$('capturePanel').hidden=true;$('editPanel').hidden=false;$('editLabel').textContent=names[side]+'：四隅を調整';renderEditor();window.scrollTo({top:0,behavior:'smooth'})}
function renderEditor(){if(!source)return;const W=source.naturalWidth,H=source.naturalHeight,max=900,s=Math.min(1,max/Math.max(W,H));canvas.width=Math.max(1,Math.round(W*s));canvas.height=Math.max(1,Math.round(H*s));drawRect={sx:canvas.width/W,sy:canvas.height/H};paint()}
function paint(){if(!source||!drawRect)return;const sx=drawRect.sx,sy=drawRect.sy;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(source,0,0,canvas.width,canvas.height);ctx.strokeStyle='#1de8ff';ctx.lineWidth=Math.max(2,canvas.width/250);ctx.beginPath();points.forEach((p,i)=>{const x=p[0]*sx,y=p[1]*sy;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.stroke();points.forEach((p,i)=>{const x=p[0]*sx,y=p[1]*sy;ctx.beginPath();ctx.arc(x,y,Math.max(9,canvas.width/55),0,Math.PI*2);ctx.fillStyle='#ffdc47';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#111';ctx.stroke();ctx.fillStyle='#111';ctx.font=`bold ${Math.max(12,canvas.width/42)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),x,y)})}
function pointerPos(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}
canvas.addEventListener('pointerdown',e=>{if(!source)return;const [x,y]=pointerPos(e),sx=drawRect.sx,sy=drawRect.sy;let best=Infinity;points.forEach((p,i)=>{const d=Math.hypot(p[0]*sx-x,p[1]*sy-y);if(d<best){best=d;drag=i}});canvas.setPointerCapture(e.pointerId);movePoint(e)});
function movePoint(e){if(drag<0)return;const [x,y]=pointerPos(e);points[drag]=[Math.max(0,Math.min(source.naturalWidth-1,x/drawRect.sx)),Math.max(0,Math.min(source.naturalHeight-1,y/drawRect.sy))];paint()}
canvas.addEventListener('pointermove',movePoint);canvas.addEventListener('pointerup',()=>drag=-1);canvas.addEventListener('pointercancel',()=>drag=-1);
// Solve an 8-variable projective mapping from output pixel coordinates to input image coordinates.
function homography(dst,src){const A=[];for(let i=0;i<4;i++){const [x,y]=dst[i],[u,v]=src[i];A.push([x,y,1,0,0,0,-u*x,-u*y,u]);A.push([0,0,0,x,y,1,-v*x,-v*y,v])}for(let j=0;j<8;j++){let k=j;for(let i=j+1;i<8;i++)if(Math.abs(A[i][j])>Math.abs(A[k][j]))k=i;if(Math.abs(A[k][j])<1e-9)throw Error('四隅の位置が不正です');[A[j],A[k]]=[A[k],A[j]];const d=A[j][j];for(let c=j;c<=8;c++)A[j][c]/=d;for(let i=0;i<8;i++){if(i===j)continue;const f=A[i][j];for(let c=j;c<=8;c++)A[i][c]-=f*A[j][c]}}return [...A.map(r=>r[8]),1]}
function warp(img,p){const targetW=630,targetH=880,dst=[[0,0],[targetW-1,0],[targetW-1,targetH-1],[0,targetH-1]],h=homography(dst,p);const temp=document.createElement('canvas');temp.width=img.naturalWidth;temp.height=img.naturalHeight;const t=temp.getContext('2d',{willReadFrequently:true});t.drawImage(img,0,0);const input=t.getImageData(0,0,temp.width,temp.height),output=document.createElement('canvas');output.width=targetW;output.height=targetH;const o=output.getContext('2d'),out=o.createImageData(targetW,targetH),src=input.data,d=out.data,iw=temp.width,ih=temp.height;for(let y=0;y<targetH;y++)for(let x=0;x<targetW;x++){const z=h[6]*x+h[7]*y+1,u=(h[0]*x+h[1]*y+h[2])/z,v=(h[3]*x+h[4]*y+h[5])/z,ix=Math.floor(u),iy=Math.floor(v),fx=u-ix,fy=v-iy,di=(y*targetW+x)*4;if(ix<0||iy<0||ix>=iw-1||iy>=ih-1){d[di+3]=255;continue}const a=(iy*iw+ix)*4,b=a+4,c=a+iw*4,dd=c+4;for(let k=0;k<3;k++)d[di+k]=src[a+k]*(1-fx)*(1-fy)+src[b+k]*fx*(1-fy)+src[c+k]*(1-fx)*fy+src[dd+k]*fx*fy;d[di+3]=255}o.putImageData(out,0,0);return output}
function cropCorner(img,x,y,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,x,y,w,h,0,0,w,h);return c.toDataURL('image/jpeg',.95)}
function isValid(p){const area=Math.abs(p.reduce((a,v,i)=>{const n=p[(i+1)%4];return a+v[0]*n[1]-n[0]*v[1]},0))/2;if(area<500)return false;let sign=0;for(let i=0;i<4;i++){const a=p[i],b=p[(i+1)%4],c=p[(i+2)%4],cross=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(Math.abs(cross)<1)return false;if(sign&&Math.sign(cross)!==sign)return false;sign=Math.sign(cross)}return true}
function saveResult(){if(!source||!isValid(points)){$('editStatus').textContent='四隅が交差しているか、範囲が小さすぎます。位置を調整してください。';return}try{const c=warp(source,points),url=c.toDataURL('image/jpeg',.95),w=c.width,h=c.height,cw=Math.round(w*.30),ch=Math.round(h*.23),corners=[cropCorner(c,0,0,cw,ch),cropCorner(c,w-cw,0,cw,ch),cropCorner(c,w-cw,h-ch,cw,ch),cropCorner(c,0,h-ch,cw,ch)];results[side]={url,corners};renderResults();source=null;$('editPanel').hidden=true;$('capturePanel').hidden=false;side++;setSide();if(side===2){stop();status('表裏の補正が完了しました。各画像を保存してください。')}else status('表面を保存しました。次は裏面を撮影してください。');window.scrollTo({top:0,behavior:'smooth'})}catch(e){$('editStatus').textContent='補正エラー：'+e.message}}
function renderResults(){const root=$('results');root.replaceChildren();results.forEach((r,i)=>{if(!r)return;const d=document.createElement('div');d.className='result';const title=document.createElement('h3');title.textContent=names[i]+'：遠近補正済み';const img=new Image();img.src=r.url;const a=document.createElement('a');a.href=r.url;a.download='card_'+(i?'back':'front')+'_corrected.jpg';a.textContent='補正したカード全体を保存';const thumbs=document.createElement('div');thumbs.className='thumbs';['左上','右上','右下','左下'].forEach((name,j)=>{const cell=document.createElement('div'),pic=new Image(),link=document.createElement('a');pic.src=r.corners[j];link.href=r.corners[j];link.download=`card_${i?'back':'front'}_corner_${j+1}.jpg`;link.textContent=name+'を保存';cell.append(pic,link);thumbs.append(cell)});d.append(title,img,a,thumbs);root.append(d)});if(!results.some(Boolean))root.innerHTML='<p>まだ画像がありません。</p>'}
$('start').onclick=start;$('stop').onclick=stop;$('snap').onclick=snap;$('file').onchange=loadFile;$('apply').onclick=saveResult;$('retake').onclick=()=>{source=null;$('editPanel').hidden=true;$('capturePanel').hidden=false;status('撮り直してください。')};$('reset').onclick=()=>{results=[null,null];side=0;source=null;setSide();renderResults();$('editPanel').hidden=true;$('capturePanel').hidden=false;status('表面からやり直せます。')};video.addEventListener('loadedmetadata',layout);window.addEventListener('resize',layout);window.addEventListener('pagehide',stop);
</script></body></html>
