<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>カード四隅メーカー｜ガイド撮影テスト</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#f5f7fc;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.wrap{max-width:560px;margin:auto;padding:16px}h1{font-size:20px;margin:6px 0}p{color:#cbd5e1;line-height:1.5;font-size:14px}.panel{background:#1b2940;border-radius:16px;padding:12px;margin:12px 0}.stage{position:relative;width:100%;height:min(67vh,620px);min-height:310px;background:#05070a;overflow:hidden;border-radius:12px}video{width:100%;height:100%;object-fit:contain}.guide{position:absolute;border:3px solid #42f5aa;border-radius:9px;box-shadow:0 0 0 999px #0005;pointer-events:none;display:none}.guide:before{content:"カードの外周を線に合わせる";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;text-align:center;color:white;text-shadow:0 1px 4px black;font-size:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}button,.btn{background:#34d399;color:#06281e;font-weight:700;border:0;border-radius:12px;padding:14px 16px;font-size:16px;cursor:pointer}button.secondary,.btn.secondary{background:#34465f;color:white}button:disabled{opacity:.45}#status{font-size:13px;color:#fcd34d;white-space:pre-wrap}img.preview{display:block;width:100%;max-width:300px;margin:10px auto;border-radius:7px}a{color:#8debc8}label.btn{display:inline-block}input[type=file]{display:none}.tiny{font-size:12px;color:#aabbd1}.done{border-top:1px solid #45556b;margin-top:12px;padding-top:10px}.pair{display:flex;gap:8px;flex-wrap:wrap}.pair a{display:inline-block;padding:8px;background:#334155;border-radius:8px;text-decoration:none;font-size:13px}</style></head><body><main class="wrap"><h1>カード四隅メーカー｜ガイド撮影</h1><p>iPhone Safari用の独立テスト版です。カードを緑枠に合わせて表面・裏面を撮影します。写真はサーバーに送信しません。</p><div class="panel"><strong id="side">① 表面を撮影</strong><div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><div class="guide" id="guide"></div></div><div class="bar"><button id="start">カメラを起動</button><button id="snap" disabled>撮影する</button><button id="stop" class="secondary" disabled>カメラ停止</button></div><div class="bar"><label class="btn secondary">写真を選ぶ（代替）<input id="file" type="file" accept="image/*"></label></div><p id="status" role="status">待機中</p><p class="tiny">緑枠はポケモンカードの比率（63×88mm）です。カードをできるだけ真上から撮影してください。枠の外側に少し余白を残すと四隅が欠けにくくなります。</p></div><div class="panel"><strong>撮影結果</strong><div id="results"><p>まだ撮影されていません。</p></div><button id="reset" class="secondary">最初から撮り直す</button></div></main><script>
'use strict';
const $=id=>document.getElementById(id),v=$('video'),stage=$('stage'),guide=$('guide'),status=$('status');
let stream=null,side=0,results=[null,null];const labels=['表面','裏面'];
function message(s){status.textContent=s}
function layout(){if(!v.videoWidth||!v.videoHeight){guide.style.display='none';return}const W=stage.clientWidth,H=stage.clientHeight,scale=Math.min(W/v.videoWidth,H/v.videoHeight);const vw=v.videoWidth*scale,vh=v.videoHeight*scale;const gh=Math.min(vh*.78,vw*.78/(63/88));const gw=gh*63/88;guide.style.cssText=`display:block;width:${gw}px;height:${gh}px;left:${(W-gw)/2}px;top:${(H-gh)/2}px`}
async function start(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('この開き方ではカメラAPIが利用できません。SafariのHTTPSページで開いてください。');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:2560}}});v.srcObject=stream;await v.play();layout();$('snap').disabled=false;$('stop').disabled=false;message('カメラ起動成功。緑枠にカードを合わせて撮影してください。')}catch(e){message('起動できません：'+e.name+' / '+e.message)}}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null;guide.style.display='none';$('snap').disabled=true;$('stop').disabled=true}
function canvasBlob(canvas){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('画像の保存に失敗しました')),'image/jpeg',.94))}
async function store(source,rect){const crop=document.createElement('canvas');crop.width=Math.round(rect.w);crop.height=Math.round(rect.h);crop.getContext('2d').drawImage(source,rect.x,rect.y,rect.w,rect.h,0,0,crop.width,crop.height);const blob=await canvasBlob(crop);const old=results[side];if(old)URL.revokeObjectURL(old.url);results[side]={url:URL.createObjectURL(blob),blob};render();side=Math.min(side+1,2);$('side').textContent=side===2?'撮影完了':`${side+1===2?'②':'①'} ${labels[side]}を撮影`;message(side===2?'表面と裏面の撮影が完了しました。画像を確認してください。':'次は裏面を緑枠に合わせて撮影してください。')}
async function snap(){if(!stream||!v.videoWidth||side>=2)return;try{const W=stage.clientWidth,H=stage.clientHeight,s=Math.min(W/v.videoWidth,H/v.videoHeight);const visibleW=v.videoWidth*s,visibleH=v.videoHeight*s;const offsetX=(W-visibleW)/2,offsetY=(H-visibleH)/2;const x=(guide.offsetLeft-offsetX)/s,y=(guide.offsetTop-offsetY)/s,w=guide.offsetWidth/s,h=guide.offsetHeight/s;const rect={x:Math.max(0,x),y:Math.max(0,y),w:Math.min(w,v.videoWidth-Math.max(0,x)),h:Math.min(h,v.videoHeight-Math.max(0,y))};await store(v,rect);if(side===2)stop()}catch(e){message('撮影エラー：'+e.message)}}
async function loadFile(e){const file=e.target.files[0];if(!file)return;try{const img=new Image(),url=URL.createObjectURL(file);await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const ratio=63/88;let w=img.naturalWidth*.78,h=w/ratio;if(h>img.naturalHeight*.78){h=img.naturalHeight*.78;w=h*ratio}await store(img,{x:(img.naturalWidth-w)/2,y:(img.naturalHeight-h)/2,w,h});URL.revokeObjectURL(url);message('写真を読み込みました。代替モードでは中央を仮切り抜きしています。ガイド位置の精度検証にはカメラ撮影を使用してください。')}catch(err){message('写真の読込エラー：'+err.message)}e.target.value=''}
function render(){const container=$('results');container.replaceChildren();results.forEach((r,i)=>{if(!r)return;const d=document.createElement('div');d.className='done';const strong=document.createElement('strong');strong.textContent=labels[i]+'（ガイド切り抜き）';const img=document.createElement('img');img.className='preview';img.src=r.url;img.alt=labels[i]+'の切り抜き画像';const links=document.createElement('div');links.className='pair';const a=document.createElement('a');a.href=r.url;a.download='card_'+(i===0?'front':'back')+'_guide.jpg';a.textContent='この画像を保存';links.append(a);d.append(strong,img,links);container.append(d)});if(!results.some(Boolean))container.innerHTML='<p>まだ撮影されていません。</p>'}
$('start').onclick=start;$('stop').onclick=stop;$('snap').onclick=snap;$('file').onchange=loadFile;$('reset').onclick=()=>{results.forEach(r=>r&&URL.revokeObjectURL(r.url));results=[null,null];side=0;$('side').textContent='① 表面を撮影';render();message('リセットしました。表面から撮影してください。');if(stream)layout()};v.addEventListener('loadedmetadata',layout);window.addEventListener('resize',layout);window.addEventListener('pagehide',stop);
</script></body></html>
